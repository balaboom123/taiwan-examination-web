name: sync-tocfl-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "55 5 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-tocfl-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: tocfl-cert-mirror-${{ hashFiles('data/providers/tocfl_cert/source-manifest.json') }}
          restore-keys: |
            tocfl-cert-mirror-

      - name: Run TOCFL cert sync
        run: python -m app sync-full --provider tocfl_cert --site-id default

      - name: Commit regenerated TOCFL cert provider data
        run: bash .github/scripts/commit-and-push.sh "chore: refresh TOCFL cert provider data" data/providers/tocfl_cert
