name: sync-ipas-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "35 6 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-ipas-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: ipas-cert-mirror-${{ hashFiles('data/providers/ipas_cert/source-manifest.json') }}
          restore-keys: |
            ipas-cert-mirror-

      - name: Run iPAS cert sync
        run: python -m app sync-full --provider ipas_cert --site-id default

      - name: Commit regenerated iPAS cert provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh iPAS cert provider data" data/providers/ipas_cert
