name: sync-rcpet-cap

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: rcpet-cap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: rcpet-cap-mirror-${{ hashFiles('data/providers/rcpet_cap/source-manifest.json') }}
          restore-keys: |
            rcpet-cap-mirror-

      - name: Run RCPET CAP sync
        run: python -m app sync-full --provider rcpet_cap --site-id default

      - name: Commit regenerated RCPET CAP provider data
        run: bash .github/scripts/commit-and-push.sh "chore: refresh RCPET CAP provider data" data/providers/rcpet_cap
