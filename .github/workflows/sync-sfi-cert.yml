name: sync-sfi-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-sfi-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: sfi-cert-mirror-${{ hashFiles('data/providers/sfi_cert/source-manifest.json') }}
          restore-keys: |
            sfi-cert-mirror-

      - name: Run SFI cert sync
        run: python -m app sync-full --provider sfi_cert --site-id default

      - name: Commit regenerated SFI cert provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh SFI cert provider data" data/providers/sfi_cert
