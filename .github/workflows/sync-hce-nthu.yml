name: sync-hce-nthu

on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: hce-nthu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: hce-nthu-mirror-${{ hashFiles('data/providers/hce_nthu/source-manifest.json') }}
          restore-keys: |
            hce-nthu-mirror-

      - name: Run NTHU HCE sync
        run: python -m app sync-full --provider hce_nthu --site-id default

      - name: Commit regenerated NTHU HCE provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh NTHU HCE provider data" data/providers/hce_nthu
