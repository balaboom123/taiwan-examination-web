name: sync-twc-recruit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: twc-recruit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: twc-recruit-mirror-${{ hashFiles('data/providers/twc_recruit/source-manifest.json') }}
          restore-keys: |
            twc-recruit-mirror-

      - name: Run TWC Recruit sync
        run: python -m app sync-full --provider twc_recruit --site-id default

      - name: Commit regenerated TWC Recruit provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh TWC Recruit provider data" data/providers/twc_recruit
