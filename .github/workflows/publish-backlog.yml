name: publish-backlog

# Publication has only ever run inside the MOEX-scoped workflows, and their
# publish steps are gated on MOEX itself having changed. A bundle owned by any
# other provider therefore waits for a MOEX change that may never come, and 36
# of them have been waiting - 1,094 paper records nobody can download.
#
# This workflow owns data/sites/default and nothing else does concurrently. It
# is serialised on one group so two providers can never regenerate the site
# catalog at the same time, while the syncs themselves stay parallel: their
# crons collide heavily (thirteen land within eighty minutes on Saturday), so
# serialising the syncs would silently drop queued runs.
#
# Collapsing a queued run of *this* workflow is harmless. The plan is recomputed
# from scratch every time, so whatever a dropped run would have published, the
# next run publishes instead.

on:
  workflow_run:
    types: [completed]
    workflows:
      - audit-recent
      - sync-ceec-ast
      - sync-ceec-gsat
      - sync-cpc-recruit
      - sync-full
      - sync-gept-cert
      - sync-hakka-cert
      - sync-hce-cmu
      - sync-hce-nsysu
      - sync-hce-nthu
      - sync-hce-tcu
      - sync-incremental
      - sync-ipas-cert
      - sync-jlpt-cert
      - sync-moea-recruit
      - sync-post-recruit
      - sync-rcpet-cap
      - sync-sfi-cert
      - sync-special-admission
      - sync-tabf-cert
      - sync-taigi-cert
      - sync-taipower-recruit
      - sync-taisugar-recruit
      - sync-tcte-tve
      - sync-teacher-qual
      - sync-teacher-recruit-central-alliance
      - sync-teacher-recruit-kaohsiung
      - sync-teacher-recruit-newtaipei
      - sync-teacher-recruit-tainan
      - sync-teacher-recruit-taipei-elementary
      - sync-teacher-recruit-taipei-junior
      - sync-teacher-recruit-taoyuan-elementary
      - sync-tii-cert
      - sync-tocfl-cert
      - sync-tqc-cert
      - sync-twc-recruit
      - sync-wdasec-skill
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Plan the publication backlog
        id: backlog
        run: |
          python -m app plan-publication-backlog --site-id default --output .tmp/publication-backlog.json
          echo "count=$(jq -r '.unpublished_bundle_count' .tmp/publication-backlog.json)" >> "$GITHUB_OUTPUT"
          echo "providers=$(jq -r '.provider_ids | join(" ")' .tmp/publication-backlog.json)" >> "$GITHUB_OUTPUT"

      # Only the providers that own an unpublished bundle need a mirror, and
      # each one's own sync workflow has already cached it. MOEX is never
      # restored here: it is the 71 GB tree the hosted bootstrap guard exists
      # to refuse, and its bundles are published by sync-incremental.
      - name: Restore mirrors for the providers with outstanding bundles
        if: steps.backlog.outputs.count != '0'
        uses: actions/cache/restore@v6
        with:
          path: mirror
          key: publish-backlog-mirror
          restore-keys: |
            cpc-recruit-mirror-
            gept-cert-mirror-
            hakka-cert-mirror-
            ipas-cert-mirror-
            moea-recruit-mirror-
            sfi-cert-mirror-
            tabf-cert-mirror-
            taigi-cert-mirror-
            tii-cert-mirror-
            tocfl-cert-mirror-
            tqc-cert-mirror-
            twc-recruit-mirror-

      # publish-site raises on any bundle failure, and a mirrored file that was
      # not restored is exactly that, so an incomplete mirror aborts the run
      # instead of publishing a download that claims more papers than it holds.
      - name: Publish the outstanding bundles
        if: steps.backlog.outputs.count != '0'
        run: >-
          python -m app publish-site --site-id default
          --repository "${{ github.repository }}"
          --publish-plan .tmp/publication-backlog.json

      - name: Ensure release exists
        if: steps.backlog.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py ensure

      - name: Upload downloadable bundles
        if: steps.backlog.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_assets.py upload

      - name: Commit the published site catalog
        if: steps.backlog.outputs.count != '0'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: publish outstanding downloadable bundles" data/sites/default

      # Recomputed from the committed catalog: if anything is still outstanding
      # the run has not done what it claims, and saying so here is what keeps
      # the backlog from going quiet again.
      - name: Confirm nothing is left outstanding
        if: steps.backlog.outputs.count != '0'
        run: |
          python -m app plan-publication-backlog --site-id default --output .tmp/publication-backlog-after.json
          remaining=$(jq -r '.unpublished_bundle_count' .tmp/publication-backlog-after.json)
          if [ "$remaining" != "0" ]; then
            echo "::error::${remaining} bundle(s) are still unpublished after this run."
            exit 1
          fi
