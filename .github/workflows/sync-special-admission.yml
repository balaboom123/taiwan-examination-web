name: sync-special-admission

on:
  workflow_dispatch:
  schedule:
    - cron: "50 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: special-admission-mirror-${{ hashFiles('data/providers/special_admission/source-manifest.json') }}
          restore-keys: |
            special-admission-mirror-

      - name: Run special admission sync
        run: python -m app sync-full --provider special_admission --site-id default

      - name: Commit regenerated special admission provider data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: refresh special admission provider data"
          git push
