name: sync-special-admission

on:
  workflow_dispatch:
  schedule:
    - cron: "50 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: special-admission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: special-admission-mirror-${{ hashFiles('data/providers/special_admission/source-manifest.json') }}
          restore-keys: |
            special-admission-mirror-

      - name: Run special admission sync
        run: python -m app sync-full --provider special_admission --site-id default

      - name: Commit regenerated special admission provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh special admission provider data" data/providers/special_admission
