name: sync-moea-recruit

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: moea-recruit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: moea-recruit-mirror-${{ hashFiles('data/providers/moea_recruit/source-manifest.json') }}
          restore-keys: |
            moea-recruit-mirror-

      - name: Run MOEA Recruit sync
        run: python -m app sync-full --provider moea_recruit --site-id default

      - name: Commit regenerated MOEA Recruit provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh MOEA Recruit provider data" data/providers/moea_recruit
