name: sync-teacher-recruit-central-alliance

on:
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-recruit-central-alliance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: teacher-recruit-central-alliance-mirror-${{ hashFiles('data/providers/teacher_recruit_central_alliance/source-manifest.json') }}
          restore-keys: |
            teacher-recruit-central-alliance-mirror-

      - name: Run Central Alliance teacher recruitment sync
        run: python -m app sync-full --provider teacher_recruit_central_alliance --site-id default

      - name: Commit regenerated Central Alliance teacher recruitment provider data
        # sync-full writes the papers it did fetch and records the ones it could
        # not, then exits non-zero. Gating this step on success discarded the
        # whole refresh whenever one upstream file was unavailable, and kept the
        # failure record out of the repository where it could be acted on.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Central Alliance teacher recruitment provider data" data/providers/teacher_recruit_central_alliance
