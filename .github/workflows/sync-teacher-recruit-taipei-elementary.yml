name: sync-teacher-recruit-taipei-elementary

on:
  workflow_dispatch:
  schedule:
    - cron: "55 5 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-recruit-taipei-elementary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: teacher-recruit-taipei-elementary-mirror-${{ hashFiles('data/providers/teacher_recruit_taipei_elementary/source-manifest.json') }}
          restore-keys: |
            teacher-recruit-taipei-elementary-mirror-

      - name: Run Taipei elementary teacher recruitment sync
        run: python -m app sync-full --provider teacher_recruit_taipei_elementary --site-id default

      - name: Commit regenerated Taipei elementary teacher recruitment provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Taipei elementary teacher recruitment provider data" data/providers/teacher_recruit_taipei_elementary
