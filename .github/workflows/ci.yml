name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate workflow contracts
        run: python -m pytest -q tests/test_workflows.py

      - name: Audit public catalog
        run: python -m app audit-catalog --repo-root . --site-id default --strict --output .tmp/catalog-audit.json

      - name: Validate publication and schemas
        run: python scripts/validate_publication.py

      - name: Audit event-level coverage
        run: python -m app history-audit --repo-root . --site-id default --strict --output .tmp/history-audit.json

      - name: Plan release shards
        run: python -m app plan-release --repo-root . --site-id default --output .tmp/release-plan.json

      - name: Validate shell scripts and whitespace
        run: |
          bash -n .github/scripts/*.sh
          git diff --check

  frontend:
    name: Frontend test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ENABLE_ADSENSE: "false"
