name: sync-teacher-recruit-kaohsiung

on:
  workflow_dispatch:
  schedule:
    - cron: "25 6 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-recruit-kaohsiung
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: teacher-recruit-kaohsiung-mirror-${{ hashFiles('data/providers/teacher_recruit_kaohsiung/source-manifest.json') }}
          restore-keys: |
            teacher-recruit-kaohsiung-mirror-

      - name: Run Kaohsiung teacher recruitment sync
        run: python -m app sync-full --provider teacher_recruit_kaohsiung --site-id default

      - name: Commit regenerated Kaohsiung teacher recruitment provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Kaohsiung teacher recruitment provider data" data/providers/teacher_recruit_kaohsiung
