name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - app/**
      - catalog/**
      - data/providers/**
      - data/sites/default/**
      - schemas/**
      - scripts/validate_publication.py
      - scripts/validate_source_inventory.py
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Python and catalog gates
        run: |
          python -m pytest -q
          python -m app audit-catalog --repo-root . --site-id default --strict --output .tmp/catalog-audit.json
          python scripts/validate_publication.py
          python scripts/validate_source_inventory.py
          python -m app history-audit --repo-root . --site-id default --strict --skip-mirror-check --output .tmp/history-audit.json
          python -m app plan-release --repo-root . --site-id default --output .tmp/release-plan.json
      - name: Validate shell scripts and whitespace
        run: |
          bash -n .github/scripts/*.sh
          git diff --check
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_ENABLE_ADSENSE: "false"
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
