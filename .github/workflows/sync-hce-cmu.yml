name: sync-hce-cmu

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: hce-cmu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: hce-cmu-mirror-${{ hashFiles('data/providers/hce_cmu/source-manifest.json') }}
          restore-keys: |
            hce-cmu-mirror-

      - name: Run CMU HCE sync
        run: python -m app sync-full --provider hce_cmu --site-id default

      - name: Commit regenerated CMU HCE provider data
        # sync-full writes the papers it did fetch and records the ones it could
        # not, then exits non-zero. Gating this step on success discarded the
        # whole refresh whenever one upstream file was unavailable, and kept the
        # failure record out of the repository where it could be acted on.
        if: '!cancelled()'
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh CMU HCE provider data" data/providers/hce_cmu
