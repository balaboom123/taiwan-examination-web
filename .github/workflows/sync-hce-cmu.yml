name: sync-hce-cmu

on:
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: hce-cmu-mirror-${{ hashFiles('data/providers/hce_cmu/source-manifest.json') }}
          restore-keys: |
            hce-cmu-mirror-

      - name: Run CMU HCE sync
        run: python -m app sync-full --provider hce_cmu --site-id default

      - name: Commit regenerated CMU HCE provider data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: refresh CMU HCE provider data"
          git push
