name: sync-taigi-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "55 5 * * 4"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-taigi-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: taigi-cert-mirror-${{ hashFiles('data/providers/taigi_cert/source-manifest.json') }}
          restore-keys: |
            taigi-cert-mirror-

      - name: Run Taigi cert sync
        run: python -m app sync-full --provider taigi_cert --site-id default

      - name: Commit regenerated Taigi cert provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Taigi cert provider data" data/providers/taigi_cert
