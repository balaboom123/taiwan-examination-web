name: sync-taipower-recruit

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: taipower-recruit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: taipower-recruit-mirror-${{ hashFiles('data/providers/taipower_recruit/source-manifest.json') }}
          restore-keys: |
            taipower-recruit-mirror-

      - name: Run Taipower Recruit sync
        run: python -m app sync-full --provider taipower_recruit --site-id default

      - name: Commit regenerated Taipower Recruit provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Taipower Recruit provider data" data/providers/taipower_recruit
