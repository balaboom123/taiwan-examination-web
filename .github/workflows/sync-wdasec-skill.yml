name: sync-wdasec-skill

on:
  workflow_dispatch:
  schedule:
    - cron: "40 3 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: wdasec-skill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: wdasec-skill-mirror-${{ hashFiles('data/providers/wdasec_skill/source-manifest.json') }}
          restore-keys: |
            wdasec-skill-mirror-

      - name: Run wdasec_skill sync
        run: python -m app sync-full --provider wdasec_skill --site-id default

      - name: Commit regenerated wdasec_skill provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh wdasec_skill provider data" data/providers/wdasec_skill
