name: sync-teacher-recruit-taipei-junior

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-recruit-taipei-junior
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: teacher-recruit-taipei-junior-mirror-${{ hashFiles('data/providers/teacher_recruit_taipei_junior/source-manifest.json') }}
          restore-keys: |
            teacher-recruit-taipei-junior-mirror-

      - name: Run Taipei junior-high teacher recruitment sync
        run: python -m app sync-full --provider teacher_recruit_taipei_junior --site-id default

      - name: Commit regenerated Taipei junior-high teacher recruitment provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh Taipei junior-high teacher recruitment provider data" data/providers/teacher_recruit_taipei_junior
