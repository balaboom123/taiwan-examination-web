name: sync-teacher-qual

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-teacher-qual
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: teacher-qual-mirror-${{ hashFiles('data/providers/teacher_qual/source-manifest.json') }}
          restore-keys: |
            teacher-qual-mirror-

      - name: Run teacher qualification sync
        run: python -m app sync-full --provider teacher_qual --site-id default

      - name: Commit regenerated teacher qualification provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh teacher qualification provider data" data/providers/teacher_qual
