name: sync-tii-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 2"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-tii-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v6
        with:
          path: mirror
          key: tii-cert-mirror-${{ hashFiles('data/providers/tii_cert/source-manifest.json') }}
          restore-keys: |
            tii-cert-mirror-

      - name: Run TII cert sync
        run: python -m app sync-full --provider tii_cert --site-id default

      - name: Commit regenerated TII cert provider data
        run: >-
          bash .github/scripts/commit-and-push.sh "chore: refresh TII cert provider data" data/providers/tii_cert
