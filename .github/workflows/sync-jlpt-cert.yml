name: sync-jlpt-cert

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 4"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-jlpt-cert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mirror directory
        uses: actions/cache@v4
        with:
          path: mirror
          key: jlpt-cert-mirror-${{ hashFiles('data/providers/jlpt_cert/source-manifest.json') }}
          restore-keys: |
            jlpt-cert-mirror-

      - name: Run JLPT cert sync
        run: python -m app sync-full --provider jlpt_cert --site-id default

      - name: Commit regenerated JLPT cert provider data
        run: bash .github/scripts/commit-and-push.sh "chore: refresh JLPT cert provider data" data/providers/jlpt_cert
