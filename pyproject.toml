[project]
name = "taiwan-examination-web"
version = "0.1.0"
description = "Mirror and normalize exam papers from MOEX."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
